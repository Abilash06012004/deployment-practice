<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
</head>
<body>

<h1>Student Registration Portal</h1>

<form id="registrationForm">

    <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="text"
        id="course"
        placeholder="Course"
        required
    >

    <button type="submit">
        Register
    </button>

</form>

<p id="status"></p>

<script type="module" src="/src/main.js"></script>

</body>
</html>
